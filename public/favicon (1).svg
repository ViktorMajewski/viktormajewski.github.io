<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Edges from center to each of the three outer nodes -->
  <line x1="50" y1="50" x2="50" y2="20" stroke="#2f6b4f" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="50" x2="24.02" y2="65" stroke="#2f6b4f" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="50" x2="75.98" y2="65" stroke="#2f6b4f" stroke-width="3" stroke-linecap="round" />

  <!-- Three outer nodes, 120 degrees apart -->
  <circle cx="50" cy="20" r="8" fill="#f5f1e8" stroke="#2f6b4f" stroke-width="3" />
  <circle cx="24.02" cy="65" r="8" fill="#f5f1e8" stroke="#2f6b4f" stroke-width="3" />
  <circle cx="75.98" cy="65" r="8" fill="#f5f1e8" stroke="#2f6b4f" stroke-width="3" />

  <!-- Central node -->
  <circle cx="50" cy="50" r="6" fill="#c0532a" />
</svg>
